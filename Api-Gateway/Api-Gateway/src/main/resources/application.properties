
spring.application.name=api-gateway
server.port:9091




eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.instance.prefer-ip-address=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka


#####################
spring.cloud.gateway.routes[0].id=ADMIN-SERVICE
spring.cloud.gateway.routes[0].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/adminOprations/**

spring.cloud.gateway.routes[1].id=DOCTOR-SERVICE
spring.cloud.gateway.routes[1].uri=lb://DOCTOR-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/doctor/**,/registerDoctor/**


spring.cloud.gateway.routes[2].id=PICKUP-SERVICE
spring.cloud.gateway.routes[2].uri=lb://PICKUP-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/pickupAdmin/**,/pickupDoctor/**

spring.cloud.gateway.routes[3].id=ORDER-SERVICE
spring.cloud.gateway.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/verifyOrder/**,/orderService/**

spring.cloud.gateway.routes[4].id=DRUG-INVENTORY
spring.cloud.gateway.routes[4].uri=lb://DRUG-INVENTORY
spring.cloud.gateway.routes[4].predicates[0]=Path=/drugs/**,/stock/**






